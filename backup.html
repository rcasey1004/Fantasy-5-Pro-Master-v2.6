<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F5 Pro: Full Data Auditor</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: white; padding: 20px; }
        .box { background: #111; padding: 20px; border-radius: 15px; border: 1px solid #222; max-width: 500px; margin: auto; }
        .stat { font-size: 24px; font-weight: bold; color: #00ffcc; margin-bottom: 10px; }
        button { background: #00ffcc; color: black; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        pre { background: #000; padding: 10px; border-radius: 8px; font-size: 11px; overflow-x: auto; color: #888; border: 1px solid #333; max-height: 200px; }
        h3 { color: #ffcc00; margin-top: 25px; }
    </style>
</head>
<body>

<div class="box">
    <h2> Full Data Auditor</h2>
    <div id="roi" class="stat">ROI: 0%</div>
    
    <h3> Draw History (Last 200)</h3>
    <pre id="histPreview">No history found...</pre>
    
    <h3> Active Vault Tickets</h3>
    <pre id="ticketPreview">No tickets found...</pre>

    <hr style="border:0; border-top:1px solid #222; margin: 20px 0;">
    
    <button onclick="downloadAll()"> DOWNLOAD FULL BACKUP (.TXT)</button>
</div>

<script>
    // Pulling the exact keys from v2.6
    const history = localStorage.getItem('f5_v26_hist') || "";
    const vault = localStorage.getItem('f5_v26_vault') || "[]";
    const stats = JSON.parse(localStorage.getItem('f5_v26_stats') || '{"spent":0, "won":0}');

    function init() {
        // Stats Calculation
        if (stats.spent > 0) {
            let roi = (stats.won / stats.spent) * 100;
            document.getElementById('roi').innerText = `ROI: ${roi.toFixed(1)}% ($${stats.won} won / $${stats.spent} spent)`;
        }
        
        // Previews
        document.getElementById('histPreview').innerText = history || "Empty";
        
        const tickets = JSON.parse(vault);
        document.getElementById('ticketPreview').innerText = tickets.length > 0 
            ? tickets.map(t => `${t.nums.join(' ')} (${t.days} days left)`).join('\n')
            : "No active tickets in vault.";
    }

    function downloadAll() {
        const timestamp = new Date().toLocaleString();
        const content = `F5 PRO MASTER BACKUP - ${timestamp}\n\n` +
                        `--- STATS ---\nSpent: $${stats.spent}\nWon: $${stats.won}\n\n` +
                        `--- ACTIVE TICKETS ---\n${document.getElementById('ticketPreview').innerText}\n\n` +
                        `--- DRAW HISTORY ---\n${history}`;
        
        const blob = new Blob([content], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `F5_Full_Backup_${new Date().toLocaleDateString()}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    window.onload = init;
</script>
</body>
</html>
