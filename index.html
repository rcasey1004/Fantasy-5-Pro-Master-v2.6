<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F5 Pro Master 2.2</title>
    <style>
        :root { --neon: #00ffcc; --gold: #ffcc00; --bg: #0a0a0a; }
        body { font-family: sans-serif; background: var(--bg); color: white; padding: 15px; margin: 0; }
        .card { background: #111; padding: 20px; border-radius: 20px; border: 1px solid #222; max-width: 450px; margin: auto; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: #1a1a1a; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #333; }
        
        /* Generator Buttons */
        .btn-gen { background: var(--neon); color: black; border: none; padding: 20px; border-radius: 15px; font-weight: 900; width: 100%; cursor: pointer; font-size: 16px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,255,204,0.3); }
        .btn-add { background: #222; color: var(--neon); border: 1px solid var(--neon); padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        
        /* Ticket Display */
        input, select { background: #1a1a1a; border: 1px solid #333; color: white; padding: 15px; border-radius: 12px; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 16px; }
        .ticket { background: #161616; padding: 18px; border-radius: 15px; margin-top: 10px; border-left: 5px solid #333; }
        .match-win { border-left-color: var(--neon); background: #001a14; }
        .match-num { color: var(--neon); font-weight: 900; text-decoration: underline; }
        .strat-label { font-size: 10px; font-weight: bold; color: black; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 5px; }
        .log-btn { background: var(--gold); border: none; padding: 10px; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="stats-grid">
        <div class="stat-box"><small>SPENT</small><br><b id="spentDisp" style="font-size:22px">$0</b></div>
        <div class="stat-box"><small>WON</small><br><b id="wonDisp" style="font-size:22px; color:var(--gold)">$0</b></div>
    </div>

    <button class="btn-gen" onclick="generate()">⚡ GENERATE AI PICKS</button>
    <div id="preview"></div>

    <hr style="border:0; border-top:1px solid #222; margin:20px 0;">

    <h3 style="color:var(--neon); margin:0 0 10px 0;">📂 TRACKER VAULT</h3>
    <input type="text" id="drawNums" placeholder="Tonight's Winners (Ex: 12 16 21...)" oninput="render()">
    <select id="drawDays">
        <option value="1">1 Day ($1)</option>
        <option value="3">3 Days ($3)</option>
        <option value="10">10 Days ($10)</option>
    </select>
    <div id="vaultList"></div>
</div>

<script>
    // Load data or start fresh
    let vault = JSON.parse(localStorage.getItem('f5_v22_vault') || "[]");
    let stats = JSON.parse(localStorage.getItem('f5_v22_stats') || '{"spent":0, "won":0}');

    function generate() {
        const preview = document.getElementById('preview');
        preview.innerHTML = '';
        
        // Barbell Strategy: Hot vs. Cold numbers
        const hot = [12, 16, 21, 29, 39, 3, 7, 10, 8, 20, 28, 38];
        const all = Array.from({length: 41}, (_, i) => i + 1);
        const cold = all.filter(n => !hot.includes(n));

        for(let i=0; i<4; i++) {
            let nums = [];
            let isTrend = i < 2;
            let pool = isTrend ? hot : cold;
            
            while(nums.length < 5) {
                let n = pool[Math.floor(Math.random() * pool.length)];
                if(!nums.includes(n)) nums.push(n);
            }
            nums.sort((a,b) => a-b);
            
            preview.innerHTML += `
                <div style="background:#1a1a1a; padding:12px; border-radius:12px; margin-bottom:8px; border:1px solid ${isTrend?'var(--neon)':'var(--gold)'};">
                    <span class="strat-label" style="background:${isTrend?'var(--neon)':'var(--gold)'}">${isTrend?'TREND':'TRAP'}</span>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:18px; font-weight:bold;">${nums.map(n => n<10?'0'+n:n).join(' ')}</span>
                        <button class="btn-add" onclick="add('${nums.join(' ')}')">ADD</button>
                    </div>
                </div>`;
        }
    }

    function add(numStr) {
        const days = parseInt(document.getElementById('drawDays').value);
        const arr = numStr.split(' ').map(Number);
        vault.unshift({ nums: arr, days: days, date: new Date().toLocaleDateString(), prize: 0 });
        stats.spent += days;
        save();
    }

    function render() {
        const winVal = document.getElementById('drawNums').value.split(/\s+/).filter(n => n !== "").map(Number);
        const list = document.getElementById('vaultList');
        list.innerHTML = '';

        vault.forEach((t, i) => {
            let matches = t.nums.filter(n => winVal.includes(n)).length;
            let numHTML = t.nums.map(n => {
                const match = winVal.includes(n);
                return `<span class="${match ? 'match-num' : ''}">${n < 10 ? '0'+n : n}</span>`;
            }).join(' ');

            list.innerHTML += `
                <div class="ticket ${matches >= 2 ? 'match-win' : ''}">
                    <div style="font-size:20px; font-weight:bold;">${numHTML}</div>
                    <div style="font-size:11px; color:#666; margin-top:8px;">Matches: ${matches} | ${t.days} Day Play | Win: $${t.prize}</div>
                    <button class="log-btn" onclick="logWin(${i})">LOG CASH WIN</button>
                    <div style="text-align:right; margin-top:-15px; color:#444;" onclick="del(${i})">× Remove</div>
                </div>`;
        });
        document.getElementById('spentDisp').innerText = `$${stats.spent}`;
        document.getElementById('wonDisp').innerText = `$${stats.won}`;
    }

    function logWin(i) {
        let p = prompt("Cash amount?");
        if(p) { stats.won += parseInt(p); vault[i].prize += parseInt(p); save(); }
    }

    function del(i) { if(confirm("Del?")) { vault.splice(i,1); save(); } }
    function save() {
        localStorage.setItem('f5_v22_vault', JSON.stringify(vault));
        localStorage.setItem('f5_v22_stats', JSON.stringify(stats));
        render();
    }
    window.onload = render;
</script>
</body>
</html>
