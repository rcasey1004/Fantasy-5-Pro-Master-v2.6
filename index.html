<html lang="en">
<head>

    <link rel="manifest" href="manifest.json">

        button { background: var(--neon); color: black; border: none; padding: 18px; border-radius: 16px; font-weight: 900; width: 100%; cursor: pointer; margin-bottom: 10px; }

        .match-win { border-left-color: var(--neon); background: #00221a; }
        .match-num { color: var(--neon); font-weight: 900; text-decoration: underline; }
        .strategy-tag { font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-bottom: 5px; display: inline-block; }
    </style>
</head>
