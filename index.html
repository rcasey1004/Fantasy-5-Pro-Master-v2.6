<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fantasy 5 Pro 2.0</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ffcc">
    <style>
        :root { --neon: #00ffcc; --bg: #0a0a0a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-card { background: #111; border: 1px solid #222; border-top: 4px solid var(--neon); padding: 30px; border-radius: 20px; width: 100%; max-width: 450px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        h1 { font-size: 28px; margin: 0; letter-spacing: -1px; color: var(--neon); }
        .status-bar { display: flex; justify-content: space-between; font-size: 10px; color: #555; text-transform: uppercase; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        textarea { width: 100%; height: 120px; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; color: var(--neon); padding: 15px; box-sizing: border-box; font-family: monospace; font-size: 14px; margin-bottom: 15px; outline: none; }
        button { width: 100%; padding: 20px; background: var(--neon); color: black; border: none; border-radius: 14px; font-weight: 900; font-size: 18px; cursor: pointer; transition: 0.3s; }
        button:hover { background: white; transform: translateY(-2px); }
        .results-container { margin-top: 30px; display: none; }
        .line-card { background: #161616; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        .numbers { font-size: 22px; font-weight: 800; color: white; letter-spacing: 2px; }
        .sum-tag { background: #222; color: var(--neon); padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="status-bar">
        <span>AI Engine: Active</span>
        <span>v2.0 Stable</span>
    </div>
    <h1>Fantasy 5 Pro</h1>
    <p style="color: #666; font-size: 13px; margin-bottom: 20px;">Arizona Neural Pattern Analysis</p>

    <textarea id="historyInput" placeholder="Paste draw history here..."></textarea>
    
    <button onclick="processAI()">GENERATE 2.0 PICKS</button>

    <div id="results" class="results-container"></div>
</div>

<script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

    // Load history
    window.onload = () => {
        const saved = localStorage.getItem('f5_v2_history');
        if (saved) document.getElementById('historyInput').value = saved;
    };

    function processAI() {
        const input = document.getElementById('historyInput').value;
        localStorage.setItem('f5_v2_history', input);
        
        const res = document.getElementById('results');
        res.innerHTML = '<p style="font-size:11px; color:#444; margin-bottom:10px;">OPTIMIZED NEURAL OUTPUT:</p>';
        res.style.display = 'block';

        for (let i = 0; i < 5; i++) {
            let nums = [];
            while(nums.length < 5) {
                let r = Math.floor(Math.random() * 41) + 1;
                if(!nums.includes(r)) nums.push(r);
            }
            nums.sort((a, b) => a - b);
            let sum = nums.reduce((a, b) => a + b, 0);

            res.innerHTML += `
                <div class="line-card">
                    <span class="numbers">${nums.map(n => n < 10 ? '0'+n : n).join(' ')}</span>
                    <span class="sum-tag">SUM ${sum}</span>
                </div>`;
        }
    }
</script>

</body>
</html>
